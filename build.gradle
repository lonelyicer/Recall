plugins {
	id 'java-library'
	id 'maven-publish'
	id 'idea'
	id 'net.neoforged.moddev' version '2.0.148'
	id 'org.jetbrains.kotlin.jvm' version '2.4.20'
	id 'org.jetbrains.dokka' version '2.2.0'
	id 'com.diffplug.spotless' version '8.10.4'
}

def release = providers.environmentVariable("RELEASE")
boolean dev = !release.map { it.toBoolean() }.getOrElse(false)
String buildNumber = providers.environmentVariable("BUILD_NUMBER").orNull

def gitHash = providers.exec {
	commandLine 'git', 'rev-parse', '--short', 'HEAD'
	ignoreExitValue = true
}.standardOutput.asText.map { it.trim() ?: "dev" }.getOrElse("dev")

version = mod_version + (dev && buildNumber != null ? "-${buildNumber}" : "")
group = mod_group_id

repositories {
	maven { url = 'https://maven.createmod.net' }
	maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
}

base {
	archivesName = mod_id
}

kotlin.jvmToolchain(25)
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()

tasks.register('javadocJar', Jar) {
	group = 'build'
	description = 'Packages Dokka HTML documentation for publication.'
	archiveClassifier.set('javadoc')
	from(tasks.named('dokkaGeneratePublicationHtml').flatMap { it.outputDirectory })
}

java.withJavadocJar()

dokka {
	dokkaPublications {
		html {
			moduleName.set('Recall')
			moduleVersion.set(project.version.toString())
			outputDirectory.set(layout.buildDirectory.dir('dokka/html'))
		}
	}
}

neoForge {
	version = project.neo_version
	addModdingDependenciesTo(sourceSets.test)
	runs {
		client {
			client()
			systemProperty 'neoforge.enabledGameTestNamespaces', 'recall_test'
		}

		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', 'recall_test'
		}

		gameTestServer {
			type = "gameTestServer"
			systemProperty 'neoforge.enabledGameTestNamespaces', 'recall_test'
		}

		data {
			serverData()
			gameDirectory = file('build/datagen')
			programArguments.addAll '--mod', 'recall_test', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/test/resources/').getAbsolutePath()
		}

		configureEach {
			sourceSet = sourceSets.test
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.DEBUG
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
		recall_test {
			sourceSet(sourceSets.test)
		}
	}
}

sourceSets.test.resources {
	srcDir 'src/generated/resources'
	exclude '.cache/**'
}

tasks.named('processResources', ProcessResources) {
	from(rootProject.layout.projectDirectory) {
		include 'LICENSE.md', 'THIRD-PARTY-NOTICES.md'
		into 'META-INF'
	}
}

tasks.named('processTestResources', ProcessResources) {
	var replaceProperties = [mod_version: project.mod_version,
							mod_license: project.mod_license,
							mod_authors: project.mod_authors,
							loader_version_range: project.loader_version_range,
							neo_version_range: project.neo_version_range,
							minecraft_version_range: project.minecraft_version_range]
	inputs.properties replaceProperties
	filesMatching('META-INF/neoforge.mods.toml') {
		expand replaceProperties
	}
	from(rootProject.layout.projectDirectory) {
		include 'LICENSE.md', 'THIRD-PARTY-NOTICES.md'
		into 'META-INF'
	}
}

tasks.named('test', Test) {
	failOnNoDiscoveredTests = false
}

var testModJar = tasks.register('testModJar', Jar) {
	group = 'build'
	description = 'Builds the demonstration mod without bundling Recall or its dependencies.'
	archiveClassifier = 'testmod'
	from sourceSets.test.output
}

tasks.named('assemble') {
	dependsOn testModJar, tasks.named('javadocJar')
}

dependencies {
	implementation "thedarkcolour:kotlinforforge-neoforge:${kotlinforforge_version}"
	implementation jarJar("net.createmod.catnip:catnip-neoforge:${catnip_version}")
	implementation jarJar("org.commonmark:commonmark:${commonmark_version}")
	implementation jarJar("org.commonmark:commonmark-ext-gfm-tables:${commonmark_version}")
	implementation jarJar("org.commonmark:commonmark-ext-gfm-strikethrough:${commonmark_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [minecraft_version      : minecraft_version,
							minecraft_version_range: minecraft_version_range,
							neo_version            : neo_version,
							neo_version_range      : neo_version_range,
							loader_version_range   : loader_version_range,
							mod_id                 : mod_id,
							mod_name               : mod_name,
							mod_license            : mod_license,
							mod_version            : mod_version,
							mod_authors            : mod_authors,
							mod_description        : mod_description,
							catnip_version         : catnip_version,
							kotlinforforge_version : kotlinforforge_version]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

jar {
	manifest {
		attributes([
				'Specification-Title'     : mod_name,
				'Specification-Vendor'    : mod_authors,
				'Specification-Version'   : project.jar.archiveVersion,
				'Implementation-Title'    : project.name,
				'Implementation-Version'  : project.jar.archiveVersion,
				'Implementation-Vendor'   : mod_authors,
				'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
				'Timestampe'              : System.currentTimeMillis(),
				'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
				'Built-On-Minecraft'      : minecraft_version,
				"MixinConfigs"            : "recall.mixins.json",
				"Git-Hash"                : gitHash
		])
	}
}

javadoc {
	options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named("sourcesJar", Jar) {
	manifest.attributes([
			"Git-Hash": gitHash
	])
}

spotless {
	format 'misc', {
		target '*.gradle', '.gitattributes', '.gitignore'
		trimTrailingWhitespace()
		leadingSpacesToTabs()
		endWithNewline()
	}
	kotlin {
		ktfmt().kotlinlangStyle()
	}
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
			artifactId = 'Recall-26.1.2-NeoForge'
		}
	}

	repositories {
		maven {
			url = "https://maven.ringlo.im/releases"
			credentials {
				username = providers.environmentVariable("MAVEN_USERNAME").orNull
				password = providers.environmentVariable("MAVEN_PASSWORD").orNull
			}
		}
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
