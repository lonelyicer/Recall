name: "Bug Report"
description: Create a bug report
labels: [ "bug" ]

body:
  - type: textarea
    attributes:
      label: Description of the bug
      description: |
        Please describe the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Screenshots
        If possible, add screenshots to help explain your problem.

  - type: textarea
    attributes:
      label: Additional context
      description: |
        Add any other context about the problem here.